        // 計算 Overall 能力值 (根據8項屬性平均)
        function calculateOverall(attrs) {
            const keys = ['insideScoring', 'outsideShooting', 'playmaking', 'perimeterDef', 'interiorDef', 'rebounding', 'athleticism'];
            const sum = keys.reduce((acc, k) => acc + attrs[k], 0);
            return Math.min(attrs.potentialCap, Math.round(sum / keys.length));
        }

        // Overall 階級評級
        function getOverallTier(ovr) {
            if (ovr < 65) return { name: 'NCAA 大學級別', color: 'bg-slate-200 text-slate-700' };
            if (ovr <= 70) return { name: 'NBA 飲水機球員', color: 'bg-gray-200 text-gray-800' };
            if (ovr <= 79) return { name: 'NBA 輪換主力', color: 'bg-blue-100 text-blue-800' };
            if (ovr <= 85) return { name: 'NBA 首發球員', color: 'bg-green-100 text-green-800' };
            if (ovr <= 90) return { name: 'NBA 全明星', color: 'bg-purple-100 text-purple-800' };
            if (ovr <= 95) return { name: 'NBA 最佳陣容級', color: 'bg-amber-100 text-amber-800' };
            if (ovr <= 98) return { name: 'MVP 級別', color: 'bg-orange-100 text-orange-800' };
            return { name: '歷史傳奇 / GOAT 級', color: 'bg-red-500 text-white font-extrabold' };
        }

        // 選秀順位生成算法（嚴格限制與現實相差最多 ±3 位）
        function generateDraftPick(realPick) {
            const minPick = Math.max(1, realPick - 3);
            const maxPick = realPick + 3;
            return Math.floor(Math.random() * (maxPick - minPick + 1)) + minPick;
        }

        // 賽季數據模擬生成器 (極貼合現實、減少誇張大三元)
        function simulateRegularSeasonStats(player, overall, team) {
            const attrs = player.attributes;
            const tend = player.tendencies;

            // 上場時間 (MPG)
            let mpg = 15 + (overall - 60) * 0.55;
            if (mpg > 37.5) mpg = 37.5;
            if (mpg < 10) mpg = 10;

            // 出手次數 (FGA, 3PA, FTA)
            let fga = (mpg / 36) * (10 + (attrs.insideScoring + attrs.outsideShooting) * 0.12);
            let threePAtend = (tend.three / 100);
            a3pa = fga * threePAtend * (attrs.outsideShooting / 85);
            if (attrs.outsideShooting < 40) a3pa = fga * 0.05; // 限制低三分能力者的出手
            let fta = (fga * 0.35) * (attrs.insideScoring / 75);

            // 命中率 FG%, 3P%, FT%
            let fgPct = 0.41 + (attrs.insideScoring * 0.0016) + (attrs.athleticism * 0.0008);
            let threePct = attrs.outsideShooting > 40 ? 0.28 + (attrs.outsideShooting * 0.0013) : 0.15;
            let ftPct = 0.65 + (attrs.outsideShooting * 0.002);
            if (ftPct > 0.92) ftPct = 0.92;

            // 得分 calculation
            let points = (fga - a3pa) * fgPct * 2 + a3pa * threePct * 3 + fta * ftPct * 1;
            
            // 籃板 calculation
            let reb = (mpg / 36) * (attrs.rebounding * 0.13 + attrs.athleticism * 0.04);
            if (player.pos.includes('C') || player.pos.includes('PF')) reb *= 1.25;

            // 助攻 calculation (限制避免過多誇張大三元)
            let ast = (mpg / 36) * (attrs.playmaking * 0.11);
            if (!player.pos.includes('PG') && !player.pos.includes('SG')) ast *= 0.6; // 非後衛助攻調整

            // 抄截與阻攻
            let stl = (mpg / 36) * (attrs.perimeterDef * 0.022);
            let blk = (mpg / 36) * (attrs.interiorDef * 0.035);

            // 正負值 (+/-)
            let plusMinus = (overall - 80) * 0.35 + (team.type === '爭冠球隊' ? 3.5 : team.type === '擺爛球隊' ? -4.2 : 0.5);

            // 出賽場次 (考慮小傷機率)
            let games = Math.floor(Math.random() * 8) + 74; 

            return {
                mpg: mpg.toFixed(1),
                pts: points.toFixed(1),
                reb: reb.toFixed(1),
                ast: ast.toFixed(1),
                stl: stl.toFixed(1),
                blk: blk.toFixed(1),
                fga: fga.toFixed(1),
                threePa: a3pa.toFixed(1),
                fta: fta.toFixed(1),
                fgPct: (fgPct * 100).toFixed(1),
                threePct: (threePct * 100).toFixed(1),
                plusMinus: plusMinus > 0 ? `+${plusMinus.toFixed(1)}` : plusMinus.toFixed(1),
                games: games
            };
        }

            let hofScore = cs.rings * 25 + cs.mvpCount * 30 + cs.fmvpCount * 20 + cs.allStarCount * 5 + cs.allNbaCount * 8;
            let hofTitle = "角色球員 (Role Player)";
            let hofBadge = "bg-slate-200 text-slate-700";

            if (hofScore >= 180) {
                hofTitle = "第一候選進入 Hall of Fame 殿堂級 (GOAT Candidate)";
                hofBadge = "bg-amber-500 text-slate-900 font-black";
            } else if (hofScore >= 100) {
                hofTitle = "NBA 歷史巨星 (Hall of Fame)";
                hofBadge = "bg-purple-600 text-white font-bold";
            } else if (hofScore >= 50) {
                hofTitle = "全明星傳奇 (All-Star Legend)";
                hofBadge = "bg-blue-600 text-white font-bold";
            }

            return `
                <div class="max-w-4xl mx-auto text-center space-y-8 py-8">
                    <div class="clean-card p-8 bg-slate-900 text-white">
                        <span class="text-6xl mb-4 inline-block">${p.avatar}</span>
                        <h2 class="text-3xl font-black mb-2">${p.name} 宣佈正式退役</h2>
                        <p class="text-slate-400 text-sm mb-6">結束了長達 ${gameState.season - 1} 個賽季的輝煌職業生涯</p>
                        
                        <div class="inline-block px-6 py-2 rounded-full text-base ${hofBadge} mb-6">
                            ${hofTitle}
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center border-t border-slate-800 pt-6">
                            <div>
                                <div class="text-xs text-slate-400">總冠軍 (Rings)</div>
                                <div class="text-2xl font-black text-amber-400">${cs.rings} 🏆</div>
                            </div>
                            <div>
                                <div class="text-xs text-slate-400">常規賽 MVP</div>
                                <div class="text-2xl font-black text-amber-400">${cs.mvpCount} 🥇</div>
                            </div>
                            <div>
                                <div class="text-xs text-slate-400">FMVP</div>
                                <div class="text-2xl font-black text-amber-400">${cs.fmvpCount} ✨</div>
                            </div>
                            <div>
                                <div class="text-xs text-slate-400">全明星 / 最佳陣容</div>
                                <div class="text-2xl font-black text-amber-400">${cs.allStarCount} / ${cs.allNbaCount}</div>
                            </div>
                        </div>
                    </div>

                    <button onclick="resetToHome()" class="btn-primary text-lg px-10 py-4 shadow-xl">
                        <i class="fa-solid fa-rotate-right mr-2"></i> 重新開始新人生
                    </button>
                </div>
            `;
        }

        // ==========================================
        // 5. 互動與流程控制 (EVENT HANDLERS & ROUTING)
        // ==========================================

        function resetToHome() {
            gameState.currentStep = 'LANDING';
            render();
        }

        function goToSelection() {
            gameState.currentStep = 'SELECTION';
            render();
        }

        function selectPlayer(playerId) {
            const rawPlayer = PLAYER_DATABASE.find(p => p.id === playerId);
            
            // 深拷貝球員屬性
            gameState.player = JSON.parse(JSON.stringify(rawPlayer));
            gameState.age = rawPlayer.startingAge;
            gameState.season = 1;
            gameState.unallocatedPoints = 10;
            gameState.tradeLogs = [];

            // 觸發選秀系統 (嚴格限制與現實相差最多 ±3 位)
            gameState.draftPick = generateDraftPick(rawPlayer.realDraftPick);

            // 隨機分配初始球隊
            const randomTeam = TEAMS[Math.floor(Math.random() * TEAMS.length)];
            gameState.team = randomTeam;

            alert(`🎉 選秀大會結果：\n你以第 ${gameState.draftPick} 順位被【${gameState.team.name}】選中！`);

            gameState.currentStep = 'ATTRIBUTE_ALLOC';
            render();
        }

        function changeAttr(attrKey, delta) {
            const attrs = gameState.player.attributes;
            const maxLimit = attrKey === 'potentialCap' ? 99 : attrs.potentialCap;
            const baseVal = gameState.player.baseAttributes[attrKey] || 30;

            if (delta > 0 && gameState.unallocatedPoints > 0 && attrs[attrKey] < maxLimit) {
                attrs[attrKey] += 1;
                gameState.unallocatedPoints -= 1;
            } else if (delta < 0 && attrs[attrKey] > baseVal) {
                attrs[attrKey] -= 1;
                gameState.unallocatedPoints += 1;
            }
            render();
        }

        function confirmAttributeAllocation() {
            gameState.currentStep = 'SEASON_HUB';
            render();
        }

        // Option 1: Trade Me (要求交易)
        function triggerTradeMeModal() {
            let optionsStr = TEAMS.map((t, idx) => `${idx + 1}. ${t.name} (${t.type} | 頭號球星: ${t.star})`).join('\n');
            let choice = prompt(`【Trade Me - 要求交易】\n請輸入你想去到的球隊編號 (1-${TEAMS.length}):\n\n${optionsStr}`);
            
            if (choice) {
                let idx = parseInt(choice) - 1;
                if (idx >= 0 && idx < TEAMS.length) {
                    let oldTeam = gameState.team.name;
                    gameState.team = TEAMS[idx];
                    let log = `【Trade Me 成功】${gameState.player.name} 從 ${oldTeam} 被交易至 ${gameState.team.name} (${gameState.team.type})，球隊交易出了 2 個首輪籤與主力球員。`;
                    gameState.tradeLogs.push(log);
                    alert(log);
                    render();
                }
            }
        }

        // Option 2: 逼球隊交易來優質球員
        function triggerForceTradeModal() {
            let log = `【逼球隊交易成功】${gameState.team.name} 管理層聽取了你的要求，送出未來首輪籤，成功交易引進了一位全明星級別的強援輔佐你！`;
            gameState.tradeLogs.push(log);
            alert(log);
            render();
        }

        // 開始賽季動態事件
        function startSeasonEvents() {
            // 洗牌隨機抽取 3 個事件
            const shuffled = [...DYNAMIC_EVENT_POOL].sort(() => 0.5 - Math.random());
            gameState.pendingEvents = shuffled.slice(0, 3);
            gameState.currentEventIndex = 0;
            gameState.eventHistoryThisSeason = [];
            gameState.currentStep = 'EVENT_MODAL';
            render();
        }

        function makeEventChoice(choiceIdx) {
            const ev = gameState.pendingEvents[gameState.currentEventIndex];
            const choice = ev.choices[choiceIdx];

            // 執行隱藏影響
            choice.action(gameState.player);
            alert(`【抉擇結果】\n${choice.effectMsg}`);

            gameState.currentEventIndex += 1;
            if (gameState.currentEventIndex < 3) {
                render();
            } else {
                // 完成 3 次事件後執行賽季模擬
                runFullSeasonSimulation();
            }
        }

        // 賽季完整模擬 (常規賽 + 傷病 + 榮譽 + 季後賽)
        function runFullSeasonSimulation() {
            const p = gameState.player;
            const ovr = calculateOverall(p.attributes);

            // 1. 常規賽數據
            const stats = simulateRegularSeasonStats(p, ovr, gameState.team);

            // 2. 傷病系統
            let injuryLog = null;
            let randInjury = Math.random();
            if (randInjury < 0.02) { // 2% 重傷
                p.attributes.insideScoring = Math.max(30, p.attributes.insideScoring - 3);
                p.attributes.athleticism = Math.max(30, p.attributes.athleticism - 3);
                injuryLog = "不幸遭遇重傷缺席剩餘賽季，賽季報銷且 Overall 永久下降 3 點！";
            } else if (randInjury < 0.22) { // 20% 小傷
                injuryLog = "賽季中期遭遇輕微扭傷，缺席部分比賽，對當季整體狀態造成輕微影響。";
            }

            // 3. 個人榮譽評定 (基於數據與戰績)
            let awards = [];
            if (parseFloat(stats.pts) >= 28.0) awards.push("NBA 賽季得分王 (Scoring Leader)");
            if (ovr >= 94 && parseFloat(stats.pts) >= 25.0) {
                awards.push("常規賽 MVP (Most Valuable Player)");
                gameState.careerStats.mvpCount += 1;
            }
            if (gameState.season === 1 && parseFloat(stats.pts) >= 14.0) {
                awards.push("年度最佳新秀 (ROTY)");
                gameState.careerStats.rotyCount += 1;
            }
            if (p.attributes.interiorDef >= 85 || p.attributes.perimeterDef >= 85) {
                if (Math.random() > 0.5) {
                    awards.push("最佳防守球員 (DPOY)");
                    gameState.careerStats.dpoyCount += 1;
                }
            }
            if (ovr >= 88) {
                awards.push("NBA 全明星 (All-Star)");
                gameState.careerStats.allStarCount += 1;
            }
            if (ovr >= 91) {
                awards.push("NBA 最佳陣容第一隊 (All-NBA 1st Team)");
                gameState.careerStats.allNbaCount += 1;
            }

            // 4. 季後賽模擬
            let playoffResult = { stage: '未晉級季後賽', desc: '球隊戰績不佳，無緣季後賽。', isChampion: false, isFmvp: false };
            if (gameState.team.type === '爭冠球隊' || (gameState.team.type === '季後賽球隊' && ovr >= 85)) {
                let pWinRand = Math.random() + (ovr >= 92 ? 0.35 : 0.1);
                if (pWinRand > 0.7) {
                    playoffResult.stage = '總決賽奪冠 (NBA Champion)';
                    playoffResult.desc = '一路披荊斬棘，成功奪得 NBA 總冠軍！';
                    playoffResult.isChampion = true;
                    gameState.careerStats.rings += 1;

                    if (ovr >= 88) {
                        playoffResult.isFmvp = true;
                        gameState.careerStats.fmvpCount += 1;
                    }
                } else if (pWinRand > 0.4) {
                    playoffResult.stage = '分區決賽 (Conference Finals)';
                    playoffResult.desc = '打入分區決賽，經歷七場苦戰遺憾落敗。';
                } else {
                    playoffResult.stage = '季後賽首輪 / 準決賽';
                    playoffResult.desc = '季後賽遭遇強敵淘汰。';
                }
            }

            // 保存賽季結果
            gameState.lastSeasonResult = {
                stats: stats,
                awards: awards,
                playoffResult: playoffResult,
                injuryLog: injuryLog
            };

            gameState.currentStep = 'SEASON_RESULT';
            render();
        }

        // 推進至下個賽季 (含年齡成長與衰退機制)
        function proceedToNextSeason() {
            gameState.season += 1;
            gameState.age += 1;

            // 生涯成長與衰退曲線
            const p = gameState.player;
            if (gameState.age <= 26) {
                // 成長期 (19-26): 年齡 +1 自然小幅提升屬性
                p.attributes.insideScoring = Math.min(p.attributes.potentialCap, p.attributes.insideScoring + 1);
                p.attributes.athleticism = Math.min(p.attributes.potentialCap, p.attributes.athleticism + 1);
            } else if (gameState.age <= 31) {
                // 黃金期 (27-31): 接近天花板
                p.attributes.outsideShooting = Math.min(p.attributes.potentialCap, p.attributes.outsideShooting + 1);
            } else {
                // 衰退期 (>31): 每年自然下降 2 點 Overall 相當於屬性小幅衰減
                p.attributes.athleticism = Math.max(30, p.attributes.athleticism - 2);
                p.attributes.insideScoring = Math.max(30, p.attributes.insideScoring - 1);
            }

            // 判斷退役條件: 39歲以上 或 Overall < 65
            const currentOvr = calculateOverall(p.attributes);
            if (gameState.age >= 39 || currentOvr < 65) {
                gameState.currentStep = 'GAME_OVER';
                render();
                return;
            }

            // 每賽季獲得 3 點可分配點數
            gameState.unallocatedPoints += 3;
            gameState.currentStep = 'ATTRIBUTE_ALLOC';
            render();
        }

        // 初始化遊戲
        render();
    </script>
</body>
</html>
